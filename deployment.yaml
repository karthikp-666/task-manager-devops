apiVersion: apps/v1
kind: Deployment

metadata:
  name: task-manager

spec:

  replicas: 2

  selector:
    matchLabels:
      app: task-manager

  template:

    metadata:
      labels:
        app: task-manager

    spec:

      containers:

        - name: task-manager

          image: YOUR_DOCKER_USERNAME/task-manager:1.0

          ports:
            - containerPort: 3000