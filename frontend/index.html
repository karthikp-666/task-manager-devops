<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Task Manager</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Task Manager</h1>

        <p class="subtitle">
            DevOps Demo Application
        </p>

        <div class="task-input">

            <input
                type="text"
                id="taskInput"
                placeholder="Enter a task..."
            >

            <button onclick="addTask()">
                Add Task
            </button>

        </div>

        <div class="tasks">

            <h2>My Tasks</h2>

            <ul id="taskList"></ul>

        </div>

        <div class="health">

            <button onclick="checkHealth()">
                Check Server
            </button>
            <p id="healthMessage"></p><br>
            <h1>Karthik</h1>
        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
